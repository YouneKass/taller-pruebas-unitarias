name: CI - Pruebas unitarias

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
      - uses: actions/checkout@v4

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      
      - name: Compliar y ejecuitar pruebas
        run: mvn -B test
      
      - name: Publicar reporte de pruebas
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Reporte de pruebas JUnit
          path: 'target/surefire-reports/*.xml'
          reporter: java-junit