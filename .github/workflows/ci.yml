name: CI - Pruebas Unitarias

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Instalar Google Chrome (para pruebas Selenium)
        uses: browser-actions/setup-chrome@v1

      - name: Compilar y ejecutar pruebas
        run: mvn -B test

      - name: Publicar reporte de pruebas
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Reporte de Pruebas JUnit
          path: 'target/surefire-reports/*.xml'
          reporter: java-junit

      - name: Publicar reporte navegable de Cucumber (BDD)
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: reporte-cucumber-bdd
          path: target/cucumber-reports/
          retention-days: 30